<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Recepção · Autoatendimento</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">🩺</span>
      <div>
        <h1 id="clinicName">Painel da recepção</h1>
        <p class="sub" id="clinicSub">Agendamentos, lembretes e conversas do WhatsApp</p>
      </div>
    </div>
    <div class="topbar-right">
      <div class="status" id="openStatus"><span class="dot"></span><span class="label">—</span></div>
      <div class="status" id="channelStatus"><span class="dot"></span><span class="label">carregando…</span></div>
    </div>
  </header>

  <section class="kpis" id="kpis"></section>

  <main class="grid">
    <section class="card contacts">
      <div class="card-head">
        <h2>Pacientes</h2>
        <div class="head-actions">
          <input id="searchContacts" type="search" placeholder="Buscar…" />
          <button id="btnNewContact" class="ghost" title="Simular um paciente novo">+ Novo</button>
        </div>
      </div>
      <div class="filters" id="filters"></div>
      <ul id="contactList" class="contact-list"></ul>
    </section>

    <section class="card chat">
      <div class="card-head chat-head">
        <div class="chat-title">
          <h2 id="chatName">Selecione um paciente</h2>
          <p class="sub" id="chatMeta">O simulador permite testar o atendimento sem conectar o WhatsApp</p>
        </div>
        <div class="chat-actions">
          <button id="btnRelease" class="ghost" title="Devolver a conversa para o atendimento automático">↩ Devolver ao bot</button>
          <button id="btnFollowups" class="ghost" title="Reagendar lembretes de 1/7/15 dias">↻ Lembretes</button>
        </div>
      </div>
      <div id="patientCard" class="patient-card"></div>
      <div id="messages" class="messages"></div>
      <form id="composer" class="composer">
        <select id="sendAs" aria-label="Enviar como">
          <option value="in">Paciente (simulador)</option>
          <option value="out">Recepção</option>
        </select>
        <input id="composerInput" type="text" placeholder="Digite uma mensagem…" autocomplete="off" />
        <button type="submit">Enviar</button>
      </form>
      <div class="quick" id="quickReplies"></div>
    </section>

    <section class="card side">
      <div class="tabs" role="tablist">
        <button class="tab active" data-tab="hoje">Hoje</button>
        <button class="tab" data-tab="agenda">Agenda</button>
        <button class="tab" data-tab="lembretes">Lembretes</button>
        <button class="tab" data-tab="atividade">Atividade</button>
        <button class="tab" data-tab="config">Ajustes</button>
      </div>
      <div class="tab-panel active" id="tab-hoje"></div>
      <div class="tab-panel" id="tab-agenda"></div>
      <div class="tab-panel" id="tab-lembretes"></div>
      <div class="tab-panel" id="tab-atividade"></div>
      <div class="tab-panel" id="tab-config"></div>
    </section>
  </main>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
